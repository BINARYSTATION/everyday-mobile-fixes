name: ReplyBar
options:
  bundleIdPrefix: io.github.binarystation
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: YES
targets:
  ReplyBar:
    type: application
    platform: iOS
    sources: [ReplyBar]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.binarystation.replybar
        INFOPLIST_KEY_CFBundleDisplayName: Reply Bar
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
  ReplyBarTests:
    type: bundle.unit-test
    platform: iOS
    sources: [ReplyBarTests]
    dependencies:
      - target: ReplyBar
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.binarystation.replybar.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/ReplyBar.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/ReplyBar"
        BUNDLE_LOADER: "$(TEST_HOST)"
  ReplyBarUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [ReplyBarUITests]
    dependencies:
      - target: ReplyBar
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.binarystation.replybar.uitests
schemes:
  ReplyBar:
    build:
      targets:
        ReplyBar: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ReplyBarTests
        - ReplyBarUITests
